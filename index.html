<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Duel — memory-4-4</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#e9eef4">
</head>
<body>
  <header class="topbar">
    <div class="brand">Memory Duel <span class="ver">v4-4</span></div>
    <div class="lang">
      <select id="langSelect" aria-label="Language">
        <option value="en" selected>EN</option>
        <option value="ru">RU</option>
        <option value="es">ES</option>
      </select>
    </div>
  </header>

  <!-- Age Gate 18+ -->
  <div id="ageGate" class="modal show">
    <div class="modal-card">
      <h3 data-i18n="age_title">Age Confirmation</h3>
      <p data-i18n="age_text">You must be 18+ to play. Confirm to continue.</p>
      <button id="ageConfirm" class="btn primary" data-i18n="age_btn" onclick="window.confirmAge && window.confirmAge()">I am 18+</button>
    </div>
  </div>

  <!-- Auth Views -->
  <main id="app">
    <section id="view-login" class="view">
      <h1 data-i18n="login_title">Sign In</h1>
      <label>
        <span data-i18n="email">Email</span>
        <input id="loginEmail" type="email" autocomplete="email" required>
      </label>
      <label>
        <span data-i18n="password">Password</span>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button id="btnLogin" class="btn primary" data-i18n="login_btn">Sign In</button>
      <button id="btnForgot" class="btn link" data-i18n="forgot">Forgot password?</button>
      <p class="muted" data-i18n="no_account">No account?</p>
      <button id="toRegister" class="btn" data-i18n="to_register">Create account</button>
    </section>

    <section id="view-register" class="view hidden">
      <h1 data-i18n="register_title">Create Account</h1>
      <label><span data-i18n="email">Email</span><input id="regEmail" type="email" required></label>
      <label><span data-i18n="password">Password</span><input id="regPassword" type="password" required></label>
      <label><span data-i18n="rating">Start Rating</span><input id="regRating" type="number" min="0" value="1000"></label>
      <label><span data-i18n="avatar">Avatar</span><input id="regAvatar" type="file" accept="image/*"></label>
      <button id="btnRegister" class="btn primary" data-i18n="register_btn">Register</button>
      <button id="toLogin" class="btn" data-i18n="to_login">Back to sign in</button>
    </section>

    <!-- Lobby -->
    <section id="view-lobby" class="view hidden">
      <div class="lobby-header">
        <h1 data-i18n="lobby_title">Lobby</h1>
        <div class="user-pill"><img id="userAvatar" alt=""><span id="userName"></span><span class="badge" id="userRating">1000</span></div>
      </div>

      <div class="controls">
        <div class="control">
          <label data-i18n="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="4x3">4 x 3 (12)</option>
            <option value="4x4">4 x 4 (16)</option>
            <option value="4x6">4 x 6 (24)</option>
          </select>
        </div>
        <div class="control">
          <label data-i18n="mode">Mode</label>
          <select id="mode">
            <option value="duel" data-i18n="duel">Duel (2 players)</option>
            <option value="solo" data-i18n="solo">Solo</option>
          </select>
        </div>
        <button id="btnCreateTable" class="btn primary" data-i18n="create_table">Create table</button>
      </div>

      <h2 data-i18n="active_tables">Active tables</h2>
      <ul id="tables" class="cards"></ul>

      <h2 data-i18n="online_players">Players online</h2>
      <div class="filter">
        <label data-i18n="rating_filter">Min rating</label>
        <input type="number" id="minRating" value="0">
      </div>
      <ul id="playersOnline" class="list"></ul>
    </section>

    <!-- Game -->
    <section id="view-game" class="view hidden">
      <div class="game-hud">
        <div class="player top">
          <img id="p1Avatar" class="avatar clickable" alt="">
          <div>
            <div id="p1Name" class="name">Player 1</div>
            <div class="meta"><span data-i18n="score">Score</span>: <span id="p1Score">0</span> • <span data-i18n="tokens">Tokens</span>: <span id="p1Tokens">0</span></div>
          </div>
          <span class="badge" id="p1Rating">1000</span>
        </div>
        <div class="turn"><span data-i18n="turn">Turn</span>: <span id="turnTimer">5</span>s</div>
      </div>

      <div id="grid" class="grid"></div>

      <div class="player bottom">
        <img id="p2Avatar" class="avatar clickable" alt="">
        <div>
          <div id="p2Name" class="name">Player 2</div>
          <div class="meta"><span data-i18n="score">Score</span>: <span id="p2Score">0</span> • <span data-i18n="tokens">Tokens</span>: <span id="p2Tokens">0</span></div>
        </div>
        <span class="badge" id="p2Rating">1000</span>
      </div>

      <button id="leaveGame" class="btn" data-i18n="leave">Leave</button>
    </section>
  </main>

  <script src="lang.js"></script>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
