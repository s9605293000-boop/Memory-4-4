<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Memory Duel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#0f3b5c">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- AUTH -->
  <div id="auth-screen" class="card">
    <h1 data-i18n="title">MEMORY DUEL</h1>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
    <div id="auth-tabs">
      <button id="tab-login" class="tab active" data-i18n="login_tab">Login</button>
      <button id="tab-register" class="tab" data-i18n="register_tab">Register</button>
    </div>
    <div id="login-form" class="form">
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-password" type="password" placeholder="Password">
      <button id="btn-login" class="primary" data-i18n="login">Login</button>
      <button id="btn-forgot" class="link" data-i18n="forgot">Forgot password</button>
      <div id="auth-error" class="error"></div>
    </div>
    <div id="register-form" class="form hidden">
      <input id="reg-email" type="email" placeholder="Email">
      <input id="reg-password" type="password" placeholder="Password (6+)">
      <input id="reg-nickname" type="text" placeholder="Nickname (3–16)">
      <div class="avatar-choose">
        <img src="assets/avatars/pirate_avatar_1.jpg" class="avatar pick active" data-avatar="pirate_avatar_1.jpg">
        <img src="assets/avatars/pirate_avatar_2.jpg" class="avatar pick" data-avatar="pirate_avatar_2.jpg">
        <img src="assets/avatars/pirate_avatar_3.jpg" class="avatar pick" data-avatar="pirate_avatar_3.jpg">
      </div>
      <button id="btn-register" class="primary" data-i18n="create">Create account</button>
      <div id="register-error" class="error"></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <div class="topbar">
      <div class="profile">
        <img id="profile-avatar" class="avatar" src="assets/avatars/pirate_avatar_1.jpg">
        <div>
          <div id="profile-name">Username</div>
          <div class="badges">
            <span class="badge" id="rating-badge">1000</span>
            <span class="badge coin">10</span>
            <span class="badge presence" id="presence-badge" data-i18n="free">Free</span>
          </div>
        </div>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </div>

    <div class="mode-buttons">
      <button id="solo-mode" class="primary" data-i18n="solo_mode">Solo Mode</button>
      <button id="duel-mode" class="secondary" data-i18n="duel_mode">Duel Mode</button>
    </div>

    <div id="level-select" class="level-select hidden">
      <h2 data-i18n="choose_level">Choose level</h2>
      <div class="levels">
        <button class="level" data-level="easy" data-i18n="easy">Easy</button>
        <button class="level" data-level="medium" data-i18n="medium">Medium</button>
        <button class="level" data-level="hard" data-i18n="hard">Hard</button>
      </div>
    </div>

    <div id="duel-panel" class="hidden">
      <h2 data-i18n="online_players">Online players</h2>
      <ul id="online-list" class="list"></ul>
      <div id="invite-info" class="hint"></div>
    </div>

    <button id="btn-logout" class="link danger" data-i18n="logout">Log out</button>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="card hidden">
    <div class="topbar">
      <button id="btn-exit-game" class="link">&larr; <span data-i18n="back">Back</span></button>
      <div id="game-info"></div>
    </div>
    <div id="board" class="board"></div>
    <div class="banks">
      <div class="bank" id="bank-p1">P1: <span>0</span></div>
      <div class="bank" id="bank-p2">P2: <span>0</span></div>
    </div>
    <div id="turn-timer" class="timer">5</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
<script src="lang.js"></script>
<script src="main.js"></script>
</body>
</html>
