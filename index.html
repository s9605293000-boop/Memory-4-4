<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Duel v4-4</title>

  <!-- Favicon -->
  <link rel="icon" href="icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========================= -->
  <!--  AGE CONFIRMATION WINDOW -->
  <!-- ========================= -->
  <div id="ageGate" class="modal show">
    <div class="modal-card">
      <h3 data-i18n="age_title">Age Confirmation</h3>
      <p data-i18n="age_text">
        You must be 18+ to play. Confirm to continue.
      </p>
      <button
        id="ageConfirm"
        class="btn primary"
        data-i18n="age_btn"
      >
        I am 18+
      </button>
    </div>
  </div>

  <!-- ========================= -->
  <!--  MAIN APP -->
  <!-- ========================= -->
  <main id="app">
    <section id="view-login" class="view">
      <h1 data-i18n="login_title">Sign In</h1>

      <label>
        <span data-i18n="email">Email</span>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          required
        />
      </label>

      <label>
        <span data-i18n="password">Password</span>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        />
      </label>

      <button id="loginBtn" class="btn primary" data-i18n="sign_in">
        Sign In
      </button>

      <p>
        <a id="createAccount" href="#" data-i18n="create_account">
          Create account
        </a>
      </p>
    </section>
  </main>

  <!-- ========================= -->
  <!--  LANGUAGE SELECT -->
  <!-- ========================= -->
  <div id="langBox">
    <select id="langSelect">
      <option value="en">EN</option>
      <option value="ru">РУС</option>
      <option value="es">ESP</option>
    </select>
  </div>

  <!-- ========================= -->
  <!--  SCRIPTS -->
  <!-- ========================= -->
  <script type="module" src="main.js"></script>
</body>
</html>
