<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Duel v4-4</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <!-- Age Gate -->
  <div id="ageGate" class="modal show">
    <div class="modal-card">
      <h3 data-i18n="age_title">Age Confirmation</h3>
      <p data-i18n="age_text">You must be 18+ to play. Confirm to continue.</p>
      <button id="ageConfirm" class="btn primary" data-i18n="age_btn">I am 18+</button>
    </div>
  </div>

  <!-- Auth Views -->
  <main id="app">
    <section id="view-login" class="view">
      <h1 data-i18n="login_title">Sign In</h1>
      <label>
        <span data-i18n="email">Email</span>
        <input id="loginEmail" type="email" autocomplete="email" required>
      </label>
      <label>
        <span data-i18n="password">Password</span>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button id="btnLogin" class="btn" data-i18n="login_btn">Sign In</button>
      <p><a href="#" id="forgotPassword" data-i18n="forgot">Forgot password?</a></p>
      <p><a href="#" id="createAccount" data-i18n="create">Create account</a></p>
    </section>
  </main>

  <!-- Language Switch -->
  <select id="langSelect">
    <option value="en">EN</option>
    <option value="ru">РУС</option>
    <option value="es">ES</option>
  </select>

  <script type="module" src="main.js"></script>
</body>
</html>
